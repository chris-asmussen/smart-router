[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.3.0"
description = "An MCP server that fronts many MCP servers and Skills behind a small tool set and routes to the best one, keeping the agent's context window small."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Asmussen", email = "157303523+chris-asmussen@users.noreply.github.com" }]
keywords = ["mcp", "model-context-protocol", "agent", "tools", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2"]

[project.urls]
Homepage = "https://github.com/chris-asmussen/warden"
Repository = "https://github.com/chris-asmussen/warden"
Issues = "https://github.com/chris-asmussen/warden/issues"

[project.scripts]
warden = "warden.__main__:main"

[tool.setuptools.packages.find]
include = ["warden*"]
